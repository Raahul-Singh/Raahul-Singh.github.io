baseURL: "https://raahulsingh.net/"
locale: "en-us"
title: "Raahul Singh"
theme: "gwern-inspired"
buildDrafts: false

markup:
  highlight:
    style: monokailight
    lineNos: false
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
  goldmark:
    renderer:
      unsafe: true
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      strikethrough: true
      table: true
      taskList: true
      typographer: true

params:
  description: "Personal website of Raahul Singh - Writings, book notes, and more."
  resumeURL: "/Raahul_Singh_Resume.pdf"
  author: "Raahul Singh"

  # Home hero
  # role: "AI Research Engineer"
  # started: 2024
  coords: "51.5072° N, 0.1276° W | London"
  intro: "Hello, I'm Raahul Singh — an AI research engineer with interests in machine learning, analysis, physics, philosophy, history, literature, and a whole bunch of other things. This website is an archive of whatever moves me enough to make a note about it."

  socialLinks:
    - name: "GitHub"
      url: "https://github.com/raahul-singh"
      icon: "github"
    # - name: "X"
    #   url: "https://x.com/raahulsingh42"
    #   icon: "x"
    - name: "LinkedIn"
      url: "https://linkedin.com/in/raahulsingh42"
      icon: "linkedin"
    - name: "GitLab"
      url: "https://gitlab.com/rasalghul2"
      icon: "gitlab"
    - name: "Email"
      url: "mailto:raahulsingh002@gmail.com"
      icon: "email"

menu:
  main:
    - identifier: "writing"
      name: "Writing"
      url: "/writings/"
      weight: 10
    - identifier: "reading"
      name: "Reading"
      url: "/reading/"
      weight: 20
    # - identifier: "now"
    #   name: "Now"
    #   url: "/now/"
    #   weight: 30

taxonomies:
  tag: "tags"
  category: "categories"

permalinks:
  writings: /writings/:contentbasename/
  reading: "/reading/:contentbasename/"

outputFormats:
  RSS:
    mediatype: "application/rss+xml"
    baseName: "feed"

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
  term:
    - HTML
