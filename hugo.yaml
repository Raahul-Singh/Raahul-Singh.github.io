baseURL: "https://raahulsingh.net/"
locale: "en-us"
title: "Raahul Singh"
theme: "gwern-inspired"
buildDrafts: false

# Enable syntax highlighting
markup:
  highlight:
    style: monokailight
    lineNos: false
  
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2

  # Configure Goldmark (Markdown renderer)
  goldmark:
    renderer:
      unsafe: true # Enable raw HTML in markdown files
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      strikethrough: true
      table: true
      taskList: true
      typographer: true

# Site parameters
params:
  description: "Personal website of Raahul Singh - Writings, book notes, and more."
  resumeURL: "/Raahul_Singh_Resume.pdf"
  # Your details
  author: "Raahul Singh"

  socialLinks:
    - name: "GitHub"
      url: "https://github.com/raahul-singh"
      icon: "github"
    # - name: "X"
    #   url: "https://x.com/raahulsingh42"
    #   icon: "x"
    - name: "LinkedIn"
      url: "https://linkedin.com/in/raahulsingh42"
      icon: "linkedin"
    - name: "GitLab"
      url: "https://gitlab.com/rasalghul2"
      icon: "gitlab"
    # - name: "Email"
    #   url: "mailto:raahulsingh002@gmail.com"
    #   icon: "email"
  
# Menu configuration
menu:
  main:
    - identifier: "home"
      name: "Home"
      url: "/"
      weight: 10
    - identifier: "writings"
      name: "Writings"
      url: "/writings/"
      weight: 20
    - identifier: "notes"
      name: "Notes"
      url: "/notes/"
      weight: 30
    - identifier: "reading"
      name: "Reading List"
      url: "/reading/"
      weight: 40

# Set default content settings
taxonomies:
  tag: "tags"
  category: "categories"

# Set permalinks
permalinks:
  writings: /writings/:contentbasename/
  # notes: "/notes/:filename/"
  reading: "/reading/:contentbasename/"

# RSS settings
outputFormats:
  RSS:
    mediatype: "application/rss+xml"
    baseName: "feed"

# Output formats for different page types
outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
  term:
    - HTML
